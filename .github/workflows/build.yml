name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip PixelGirlPet-v3.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug
        working-directory: PixelGirlPet
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-girl-pet-apk
          path: PixelGirlPet/app/build/outputs/apk/debug/app-debug.apk
