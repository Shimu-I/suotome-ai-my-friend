name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Suotome-Ai-my-friend.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - run: gradle assembleDebug
        working-directory: Suotome-Ai-my-friend
      - uses: actions/upload-artifact@v4
        with:
          name: suotome-ai-my-friend-apk
          path: Suotome-Ai-my-friend/app/build/outputs/apk/debug/app-debug.apk
